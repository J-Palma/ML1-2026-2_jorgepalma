[project]
name = "proyecto-ml"
version = "0.1.0"
description = "Trabajos Prácticos y proyectos de Machine Learning - FIUNA"
authors = [
    {name = "Jorge Palma", email = "jpalma@fiuna.edu.py"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
